        lig:
          type: string
        ev_sahibi:
          type: string
        deplasman:
          type: string
        oran_1:
          type: ["number", "null"]
        oran_x:
          type: ["number", "null"]
        oran_2:
          type: ["number", "null"]
        alt_orani:
          type: ["number", "null"]
        ust_orani:
          type: ["number", "null"]
        kg_var:
          type: ["number", "null"]
        kg_yok:
          type: ["number", "null"]
        durum:

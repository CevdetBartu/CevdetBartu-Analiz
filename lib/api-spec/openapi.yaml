openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: matches
    description: Historical match operations
  - name: analysis
    description: Match analysis engine
  - name: today
    description: Today's scheduled matches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all historical matches
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchRecord"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Add a historical match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRecord"
        "400":
          description: Validation error

  /matches/find-similar:
    post:
      operationId: findSimilarMatches
      tags: [matches]
      summary: Find similar historical matches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarityQuery"
      responses:
        "200":
          description: Ranked list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarMatchResult"
        "400":
          description: Validation error

  /analyze:
    post:
      operationId: analyzeMatches
      tags: [analysis]
      summary: Analyze a target match against reference matches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Validation error

  /matches/{id}:
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a historical match
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /today-matches:
    get:
      operationId: getTodayMatches
      tags: [today]
      summary: Get today's scheduled matches with odds
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
          description: Date in YYYY-MM-DD format (defaults to today)
      responses:
        "200":
          description: Today's matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayMatchesResponse"

  /today-matches/refresh:
    post:
      operationId: refreshTodayMatches
      tags: [today]
      summary: Manually refresh today's match data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MatchInput:
      type: object
      required:
        - league
        - homeTeam
        - awayTeam
        - ftScore
        - oddsHome
        - oddsDraw
        - oddsAway
      properties:
        matchDate:
          type: ["string", "null"]
        league:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        htScore:
          type: ["string", "null"]
        ftScore:
          type: string
        previousScore:
          type: ["string", "null"]
        yellowCardsHome:
          type: ["integer", "null"]
        yellowCardsAway:
          type: ["integer", "null"]
        redCards:
          type: ["integer", "null"]
        ligSirasiHome:
          type: ["integer", "null"]
        ligSirasiAway:
          type: ["integer", "null"]
        ligSirasiTotal:
          type: ["integer", "null"]
        oddsHome:
          type: number
        oddsDraw:
          type: number
        oddsAway:
          type: number
        altOdds:
          type: ["number", "null"]
        ustOdds:
          type: ["number", "null"]
        varOdds:
          type: ["number", "null"]
        yokOdds:
          type: ["number", "null"]
        altOdds35:
          type: ["number", "null"]
        ustOdds35:
          type: ["number", "null"]
        iyAltOdds15:
          type: ["number", "null"]
        iyUstOdds15:
          type: ["number", "null"]
        iyAltOdds05:
          type: ["number", "null"]
        iyUstOdds05:
          type: ["number", "null"]
        avgOddsMin:
          type: ["number", "null"]
        avgOddsMax:
          type: ["number", "null"]
        imResult:
          type: ["string", "null"]
        kornerHome:
          type: ["integer", "null"]
        kornerAway:
          type: ["integer", "null"]

    MatchRecord:
      type: object
      required:
        - id
        - league
        - homeTeam
        - awayTeam
        - ftScore
        - oddsHome
        - oddsDraw
        - oddsAway
        - createdAt
      properties:
        id:
          type: integer
        matchDate:
          type: ["string", "null"]
        league:
          type: string
        homeTeam:
          type: string
        awayTeam:
          type: string
        htScore:
          type: ["string", "null"]
        ftScore:
          type: string
        previousScore:
          type: ["string", "null"]
        yellowCardsHome:
          type: ["integer", "null"]
        yellowCardsAway:
          type: ["integer", "null"]
        redCards:
          type: ["integer", "null"]
        ligSirasiHome:
          type: ["integer", "null"]
        ligSirasiAway:
          type: ["integer", "null"]
        ligSirasiTotal:
          type: ["integer", "null"]
        oddsHome:
          type: number
        oddsDraw:
          type: number
        oddsAway:
          type: number
        altOdds:
          type: ["number", "null"]
        ustOdds:
          type: ["number", "null"]
        varOdds:
          type: ["number", "null"]
        yokOdds:
          type: ["number", "null"]
        altOdds35:
          type: ["number", "null"]
        ustOdds35:
          type: ["number", "null"]
        iyAltOdds15:
          type: ["number", "null"]
        iyUstOdds15:
          type: ["number", "null"]
        iyAltOdds05:
          type: ["number", "null"]
        iyUstOdds05:
          type: ["number", "null"]
        avgOddsMin:
          type: ["number", "null"]
        avgOddsMax:
          type: ["number", "null"]
        imResult:
          type: ["string", "null"]
        kornerHome:
          type: ["integer", "null"]
        kornerAway:
          type: ["integer", "null"]
        createdAt:
          type: string

    SimilarityQuery:
      type: object
      required:
        - oddsHome
        - oddsDraw
        - oddsAway
      properties:
        oddsHome:
          type: number
        oddsDraw:
          type: number
        oddsAway:
          type: number
        altOdds:
          type: ["number", "null"]
        ustOdds:
          type: ["number", "null"]
        varOdds:
          type: ["number", "null"]
        yokOdds:
          type: ["number", "null"]
        altOdds35:
          type: ["number", "null"]
        ustOdds35:
          type: ["number", "null"]
        iyAltOdds15:
          type: ["number", "null"]
        iyUstOdds15:
          type: ["number", "null"]
        iyAltOdds05:
          type: ["number", "null"]
        iyUstOdds05:
          type: ["number", "null"]
        league:
          type: ["string", "null"]
        ligSirasiDiff:
          type: ["integer", "null"]
        avgCardsTotal:
          type: ["number", "null"]
        maxResults:
          type: ["integer", "null"]

    SimilarMatchResult:
      type: object
      required:
        - match
        - similarityScore
        - scoreBreakdown
      properties:
        match:
          $ref: "#/components/schemas/MatchRecord"
        similarityScore:
          type: number
        scoreBreakdown:
          $ref: "#/components/schemas/ScoreBreakdown"

    ScoreBreakdown:
      type: object
      required:
        - oddsScore
        - leagueScore
        - cardScore
      properties:
        oddsScore:
          type: number
        leagueScore:
          type: number
        cardScore:
          type: number

    AnalyzeRequest:
      type: object
      required:
        - targetMatch
        - referenceMatches
      properties:
        targetMatch:
          $ref: "#/components/schemas/TargetMatchInput"
        referenceMatches:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceMatchInput"

    TargetMatchInput:
      type: object
      required:
        - homeTeam
        - awayTeam
      properties:
        date:
          type: ["string", "null"]
        time:
          type: ["string", "null"]
        league:
          type: ["string", "null"]
        homeTeam:
          type: string
        awayTeam:
          type: string
        ligSirasiHome:
          type: ["integer", "null"]
        ligSirasiAway:
          type: ["integer", "null"]
        ligSirasiTotal:
          type: ["integer", "null"]
        oddsHome:
          type: ["number", "null"]
        oddsDraw:
          type: ["number", "null"]
        oddsAway:
          type: ["number", "null"]
        altOdds:
          type: ["number", "null"]
        ustOdds:
          type: ["number", "null"]
        varOdds:
          type: ["number", "null"]
        yokOdds:
          type: ["number", "null"]
        altOdds35:
          type: ["number", "null"]
        ustOdds35:
          type: ["number", "null"]
        iyAltOdds15:
          type: ["number", "null"]
        iyUstOdds15:
          type: ["number", "null"]
        iyAltOdds05:
          type: ["number", "null"]
        iyUstOdds05:
          type: ["number", "null"]
        avgOddsMin:
          type: ["number", "null"]
        avgOddsMax:
          type: ["number", "null"]

    ReferenceMatchInput:
      type: object
      required:
        - homeTeam
        - awayTeam
        - ftScore
      properties:
        id:
          type: ["string", "null"]
        homeTeam:
          type: string
        awayTeam:
          type: string
        htScore:
          type: ["string", "null"]
        ftScore:
          type: string
        previousScore:
          type: ["string", "null"]
        yellowCardsHome:
          type: ["integer", "null"]
        yellowCardsAway:
          type: ["integer", "null"]
        redCards:
          type: ["integer", "null"]
        ligSirasiHome:
          type: ["integer", "null"]
        ligSirasiAway:
          type: ["integer", "null"]
        ligSirasiTotal:
          type: ["integer", "null"]
        oddsHome:
          type: ["number", "null"]
        oddsDraw:
          type: ["number", "null"]
        oddsAway:
          type: ["number", "null"]
        altOdds:
          type: ["number", "null"]
        ustOdds:
          type: ["number", "null"]
        varOdds:
          type: ["number", "null"]
        yokOdds:
          type: ["number", "null"]
        altOdds35:
          type: ["number", "null"]
        ustOdds35:
          type: ["number", "null"]
        iyAltOdds15:
          type: ["number", "null"]
        iyUstOdds15:
          type: ["number", "null"]
        iyAltOdds05:
          type: ["number", "null"]
        iyUstOdds05:
          type: ["number", "null"]
        avgOddsMin:
          type: ["number", "null"]
        avgOddsMax:
          type: ["number", "null"]
        imResult:
          type: ["string", "null"]
        kornerHome:
          type: ["integer", "null"]
        kornerAway:
          type: ["integer", "null"]

    AnalyzeResponse:
      type: object
      required:
        - analiz_ozet
        - tahminler
        - tablo_satirlari
      properties:
        analiz_ozet:
          $ref: "#/components/schemas/AnalizOzet"
        tahminler:
          type: array
          items:
            type: string
        tablo_satirlari:
          type: array
          items:
            $ref: "#/components/schemas/TabloSatiri"

    AnalizOzet:
      type: object
      required:
        - total_mac
        - ev_sahibi
        - beraberlik
        - deplasman
        - kg_var
        - ust_25
        - ust_35
        - iy_ust_15
        - iy_ust_05
        - ort_kart
        - ust_10_korner
      properties:
        total_mac:
          type: integer
        ev_sahibi:
          $ref: "#/components/schemas/StatGroup"
        beraberlik:
          $ref: "#/components/schemas/StatGroup"
        deplasman:
          $ref: "#/components/schemas/StatGroup"
        kg_var:
          $ref: "#/components/schemas/StatGroup"
        ust_25:
          $ref: "#/components/schemas/StatGroup"
        ust_35:
          $ref: "#/components/schemas/StatGroup"
        iy_ust_15:
          $ref: "#/components/schemas/StatGroup"
        iy_ust_05:
          $ref: "#/components/schemas/StatGroup"
        ort_kart:
          type: number
        ort_korner:

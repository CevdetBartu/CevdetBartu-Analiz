        id:
          type: string
        is_target:
          type: boolean
        analiz_yuzde:
          type: string
        iy_skor:
          type: ["string", "null"]
        iy_skor_renk:
          type: ["string", "null"]
        iy_skor_sik_mi:
          type: boolean
        ms_skor:
          type: ["string", "null"]
        ms_skor_renk:
          type: ["string", "null"]
        ms_skor_sik_mi:
          type: boolean
        iy_tahmini:
          type: ["string", "null"]
        ms_tahmini:
          type: ["string", "null"]
        row_renk:
          type: string
        takimlar:
          type: string
        is_highlight:
          type: boolean
        onceki_skor:
          type: string
        kirmizi_kart_var_mi:
          type: boolean
        kart_display:
          type: string
        kart_yuksek_mi:
          type: boolean
        lig_sirasi:
          type: string
        taraf_oranlari:
          $ref: "#/components/schemas/TarafOranlari"
        alt_ust:
          $ref: "#/components/schemas/AltUst"
        alt_ust_35:
          $ref: "#/components/schemas/AltUst"
        iy_alt_ust_15:
          $ref: "#/components/schemas/AltUst"
        iy_alt_ust_05:
          $ref: "#/components/schemas/AltUst"
        var_yok:
          $ref: "#/components/schemas/VarYok"
        ortalama:
          type: string
        korner_display:
          type: string
        im_sonuc:
          type: string
        im_renk:
          type: string

    TarafOranlari:
      type: object
      properties:
        ev:
          type: ["string", "null"]
        ber:
          type: ["string", "null"]
        dep:
          type: ["string", "null"]
        kazanan:
          type: ["string", "null"]

    AltUst:
      type: object
      properties:
        alt:
          type: ["string", "null"]
        ust:
          type: ["string", "null"]
        kazanan:
          type: ["string", "null"]

    VarYok:
      type: object
      properties:
        var:
          type: ["string", "null"]
        yok:
          type: ["string", "null"]
        kazanan:
          type: ["string", "null"]

    TodayMatch:

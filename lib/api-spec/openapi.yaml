        - is_target
        - analiz_yuzde
        - row_renk
        - takimlar
        - is_highlight
        - onceki_skor
        - kirmizi_kart_var_mi
        - kart_display
        - kart_yuksek_mi
        - lig_sirasi
        - taraf_oranlari
        - alt_ust
        - alt_ust_35
        - iy_alt_ust_15
        - iy_alt_ust_05
        - var_yok
        - ortalama
        - korner_display
        - im_sonuc
        - im_renk

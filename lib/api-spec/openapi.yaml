    TodayMatchesResponse:
      type: object
      required:
        - date
        - matches
        - total
        - last_updated
      properties:
        date:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/TodayMatch"
        total:
          type: integer
        last_updated:
          type: ["string", "null"]

    RefreshResult:
      type: object
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
        message:
          type: string
        added:
          type: integer
        updated:
          type: integer

    RefreshRequest:
      type: object
      properties:
        date:
          type: string
          nullable: true
